workflows:
  ios-release:
    name: Flowl iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.flowl.study
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: lts
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: npm install

      - name: Prepare web assets
        script: npm run prepare:www

      - name: Create and sync iOS project
        script: |
          npx cap add ios
          npx cap sync ios
          # Apple requires iOS 15.0 or later for App Store uploads from Spring 2027.
          # The iOS project is generated during CI, so apply the target after sync.
          sed -i '' "s/platform :ios, '14.0'/platform :ios, '15.0'/" \
            "$CM_BUILD_DIR/ios/App/Podfile"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.0;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          # Version 1.0 is already approved; updates must use a higher marketing version.
          sed -i '' 's/MARKETING_VERSION = 1.0;/MARKETING_VERSION = 1.1;/g' \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"
          cp "$CM_BUILD_DIR/app-icon.png" \
            "$CM_BUILD_DIR/ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png"
          # Keep iPhone and iPad enabled. The responsive web UI supplies a dedicated
          # two-pane layout on tablet-sized screens.
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1;/TARGETED_DEVICE_FAMILY = "1,2";/g' \
            "$CM_BUILD_DIR/ios/App/App.xcodeproj/project.pbxproj"

      - name: Install CocoaPods dependencies
        script: |
          cd ios/App
          pod install

      - name: Set build number
        script: |
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER"

      - name: Set up code signing
        script: |
          xcode-project use-profiles --project "$CM_BUILD_DIR/ios/App/App.xcodeproj"

      - name: Build signed IPA
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
      
    publishing:
      app_store_connect:
        auth: integration
